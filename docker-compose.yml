version: '3.8'

services:
  server:
    build: ./server
    container_name: tennistcg-server
    restart: unless-stopped
    environment:
      - PORT=3001
      - CLIENT_URL=http://${NAS_IP:-192.168.1.109}:${CLIENT_PORT:-3022}
      - NODE_ENV=production
    volumes:
      # Montez vos illustrations WebP ici :
      - ${ARTWORKS_PATH:-./artworks}:/app/public/artworks:ro
    ports:
      - "${SERVER_PORT:-3023}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      args:
        - VITE_SERVER_URL=http://${NAS_IP:-192.168.1.109}:${SERVER_PORT:-3023}
    container_name: tennistcg-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3022}:80"
    depends_on:
      - server

networks:
  default:
    name: nginx-proxy-manager_default
    external: true
